[versions]
agp = "9.2.0"
kotlin = "2.3.21"
compose-bom = "2026.04.01"
activity-compose = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.9.8"
work = "2.11.2"
hilt = "2.60.1"
