ksp = "2.3.11"
core-ktx = "1.19.0"
sqlcipher = "4.17.0"
sqlite = "2.4.0"
room = "2.7.0"
junit = "4.13.2"


zxing = "3.5.3"
camerax = "1.3.1"
guava = "32.1.3-android"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
