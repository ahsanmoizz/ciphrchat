[package]
name = "ciphrchat-ffi"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
ciphrchat-protocol = { path = "../ciphrchat-protocol" }
ciphrchat-routing = { path = "../ciphrchat-routing" }
jni = "0.21.1"
tokio = { version = "1", features = ["rt-multi-thread"] }
libp2p = { version = "0.53.2", features = ["ed25519", "tcp"] }
