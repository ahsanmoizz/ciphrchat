[workspace]
resolver = "2"
members = [
  "ciphrchat-core",
  "ciphrchat-protocol",
  "ciphrchat-routing",
  "ciphrchat-ffi"
]

[workspace.package]
edition = "2021"
license = "AGPL-3.0"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }
