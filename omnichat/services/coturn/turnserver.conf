# CiphrChat Coturn TURN/STUN Server Configuration

realm=ciphrchat.internal
server-name=ciphrchat-coturn

listening-port=3478
tls-listening-port=5349
min-port=49152
max-port=49200

# Long-term credential mechanism for WebRTC clients
lt-cred-mech
user=ciphrchat:ciphrchat_turn_secret

# Security & privacy hardening
fingerprint
no-cli
no-multicast-peers
no-loopback-peers
mobility
stale-nonce=600

# Logging
verbose
log-file=stdout
