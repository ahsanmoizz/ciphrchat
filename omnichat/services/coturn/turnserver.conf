# CiphrChat Coturn TURN/STUN Server Configuration
# Note: Actual credentials must be supplied via deployment environment variables (e.g. static-auth-secret or lt-cred-mech)

realm=ciphrchat.internal
server-name=ciphrchat-coturn

listening-port=3478
tls-listening-port=5349
min-port=49152
max-port=49200

# Long-term credential mechanism for WebRTC clients
# Production deployments should inject static-auth-secret or dynamic database credentials
lt-cred-mech

# Security & privacy hardening
fingerprint
no-cli
no-multicast-peers
no-loopback-peers
mobility
stale-nonce=600

# Logging
verbose
log-file=stdout
