services:
  relay:
    build: .
    ports:
      - "4001:4001/tcp"
      - "4001:4001/udp"
      # Health, info, and large-file streaming API
      - "127.0.0.1:18081:8080/tcp"
    environment:
      - CIPHRCHAT_HEALTH_PORT=8080
      - CIPHRCHAT_RELAY_TCP_PORT=4001
      - CIPHRCHAT_RELAY_QUIC_PORT=4001
      - CIPHRCHAT_FILES_DIRECTORY=/var/lib/ciphrchat/files
      - CIPHRCHAT_MAILBOX_DIRECTORY=/var/lib/ciphrchat/mailbox
      - CIPHRCHAT_FILE_STORAGE_QUOTA_BYTES=${CIPHRCHAT_FILE_STORAGE_QUOTA_BYTES:-53687091200}
      - TURN_STATIC_AUTH_SECRET=${TURN_STATIC_AUTH_SECRET:-}
      - TURN_PUBLIC_URL=${TURN_PUBLIC_URL:-turn:127.0.0.1:3478}
      - TURN_CREDENTIAL_TTL_SECONDS=${TURN_CREDENTIAL_TTL_SECONDS:-600}
    volumes:
      - relay-data:/var/lib/ciphrchat
    restart: unless-stopped

  coturn:
    image: coturn/coturn:latest
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "5349:5349/udp"
      - "49152-49200:49152-49200/udp"
    environment:
      - TURN_REALM=${TURN_REALM:-ciphrchat.internal}
      - TURN_STATIC_AUTH_SECRET=${TURN_STATIC_AUTH_SECRET:-}
    volumes:
      - ../coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: >
      sh -c 'turnserver -c /etc/coturn/turnserver.conf
      --static-auth-secret="$$TURN_STATIC_AUTH_SECRET"
      --realm="$$TURN_REALM"'
    restart: unless-stopped

volumes:
  relay-data:
