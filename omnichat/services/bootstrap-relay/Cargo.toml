[package]
name = "ciphrchat-bootstrap-relay"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
futures = "0.3"
libp2p = { version = "0.53.2", features = [
    "macros",
    "identify",
    "noise",
    "ping",
    "quic",
    "relay",
    "tcp",
    "tokio",
    "yamux"
] }
