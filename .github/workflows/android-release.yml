name: Android Release

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "ANDROID_KEYSTORE_BASE64 is required" >&2; exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ciphrchat-release.jks"
          test -s "$RUNNER_TEMP/ciphrchat-release.jks"

      - name: Build signed release APK
        working-directory: ./omnichat
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ciphrchat-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          CIPHRCHAT_RELAY_ADDRESS: ${{ vars.CIPHRCHAT_RELAY_ADDRESS }}
        run: |
          test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          chmod +x ./gradlew
          ./gradlew assembleRelease -PbuildRust

      - name: Verify APK signature and checksum
        id: verify
        working-directory: ./omnichat
        run: |
          APK="apps/android/build/outputs/apk/release/android-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Upload signed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ciphrchat-android-release
          path: |
            omnichat/apps/android/build/outputs/apk/release/android-release.apk
            omnichat/apps/android/build/outputs/apk/release/android-release.apk.sha256

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            omnichat/apps/android/build/outputs/apk/release/android-release.apk \
            omnichat/apps/android/build/outputs/apk/release/android-release.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "CiphrChat $GITHUB_REF_NAME" \
            --generate-notes
