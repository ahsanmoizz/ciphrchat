name: Deploy relay to VPS

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: ciphrchat-relay-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.CIPHRCHAT_VPS_SSH_KEY }}
        run: |
          test -n "$VPS_SSH_KEY" || (echo "CIPHRCHAT_VPS_SSH_KEY is required" >&2; exit 1)
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/ciphrchat_vps"
          chmod 600 "$HOME/.ssh/ciphrchat_vps"

      - name: Install relay files
        env:
          VPS_HOST: ${{ secrets.CIPHRCHAT_VPS_HOST }}
          VPS_USER: ${{ secrets.CIPHRCHAT_VPS_USER }}
          VPS_PORT: ${{ secrets.CIPHRCHAT_VPS_PORT || '22' }}
        run: |
          set -eu
          target="$VPS_USER@$VPS_HOST"
          ssh -i "$HOME/.ssh/ciphrchat_vps" -p "$VPS_PORT" \
            -o StrictHostKeyChecking=accept-new "$target" \
            'sudo mkdir -p /opt/ciphrchat-relay && sudo chown "$USER":"$USER" /opt/ciphrchat-relay'
          scp -i "$HOME/.ssh/ciphrchat_vps" -P "$VPS_PORT" -r \
            omnichat/services/bootstrap-relay/Cargo.toml \
            omnichat/services/bootstrap-relay/Cargo.lock \
            omnichat/services/bootstrap-relay/Dockerfile \
            omnichat/services/bootstrap-relay/.dockerignore \
            omnichat/services/bootstrap-relay/compose.yaml \
            omnichat/services/bootstrap-relay/src \
            "$target:/opt/ciphrchat-relay/"

      - name: Build and restart relay
        env:
          VPS_HOST: ${{ secrets.CIPHRCHAT_VPS_HOST }}
          VPS_USER: ${{ secrets.CIPHRCHAT_VPS_USER }}
          VPS_PORT: ${{ secrets.CIPHRCHAT_VPS_PORT || '22' }}
        run: |
          set -eu
          target="$VPS_USER@$VPS_HOST"
          ssh -i "$HOME/.ssh/ciphrchat_vps" -p "$VPS_PORT" \
            -o StrictHostKeyChecking=accept-new "$target" \
            'cd /opt/ciphrchat-relay && docker compose up -d --build --remove-orphans && curl --fail --silent http://127.0.0.1:8080/health'

      - name: Report relay identity and address
        env:
          VPS_HOST: ${{ secrets.CIPHRCHAT_VPS_HOST }}
          VPS_USER: ${{ secrets.CIPHRCHAT_VPS_USER }}
          VPS_PORT: ${{ secrets.CIPHRCHAT_VPS_PORT || '22' }}
        run: |
          set -eu
          target="$VPS_USER@$VPS_HOST"
          info=$(ssh -i "$HOME/.ssh/ciphrchat_vps" -p "$VPS_PORT" \
            -o StrictHostKeyChecking=accept-new "$target" \
            'curl --fail --silent http://127.0.0.1:8080/info')
          echo "$info"
          {
            echo "### Relay identity"
            echo '```json'
            echo "$info"
            echo '```'
            echo "Use the returned peer ID with: \\`/ip4/$VPS_HOST/tcp/4001/p2p/<peerId>\\`"
          } >> "$GITHUB_STEP_SUMMARY"
