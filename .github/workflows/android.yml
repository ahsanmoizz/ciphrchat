name: Android CI

permissions:
  contents: write

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: set up JDK 17
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

    - name: Install cargo-ndk
      run: cargo install cargo-ndk

    - name: Grant execute permission for gradlew
      run: chmod +x omnichat/gradlew

    - name: Build Debug APK
      working-directory: ./omnichat
      env:
        CIPHRCHAT_RELAY_ADDRESS: ${{ vars.CIPHRCHAT_RELAY_ADDRESS }}
      run: ./gradlew assembleDebug -PbuildRust

    - name: Run Lint
      working-directory: ./omnichat
      run: ./gradlew lint

    - name: Run Android unit tests
      working-directory: ./omnichat
      run: ./gradlew testDebugUnitTest

    - name: Upload APK
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: app-debug
        path: omnichat/apps/android/build/outputs/apk/debug/android-debug.apk

    - name: Publish latest APK release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release view latest --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
          gh release create latest \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Latest Android build" \
            --notes "Download the latest CiphrChat Android development build." \
            --prerelease
        gh release upload latest \
          omnichat/apps/android/build/outputs/apk/debug/android-debug.apk \
          --repo "$GITHUB_REPOSITORY" \
          --clobber
