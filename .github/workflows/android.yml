name: Android CI

permissions:
  contents: write

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

    - name: Install cargo-ndk
      run: cargo install cargo-ndk

    - name: Grant execute permission for gradlew
      run: chmod +x omnichat/gradlew

    - name: Build Debug APK
      working-directory: ./omnichat
      run: ./gradlew assembleDebug -PbuildRust

    - name: Run Lint
      working-directory: ./omnichat
      run: ./gradlew lint

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: omnichat/apps/android/build/outputs/apk/debug/android-debug.apk

    - name: Publish latest APK release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release view latest --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
          gh release create latest \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Latest Android build" \
            --notes "Download the latest CiphrChat Android development build." \
            --prerelease
        gh release upload latest \
          omnichat/apps/android/build/outputs/apk/debug/android-debug.apk \
          --repo "$GITHUB_REPOSITORY" \
          --clobber
