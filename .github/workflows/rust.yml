name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Check shared Rust formatting
        working-directory: omnichat/crates
        run: cargo fmt --all --check

      - name: Run shared Rust clippy
        working-directory: omnichat/crates
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run shared Rust tests
        working-directory: omnichat/crates
        run: cargo test --workspace

      - name: Verify deployed encrypted mailbox end to end
        working-directory: omnichat/crates
        env:
          CIPHRCHAT_RELAY_ADDRESS: ${{ vars.CIPHRCHAT_RELAY_ADDRESS }}
        run: |
          test -n "$CIPHRCHAT_RELAY_ADDRESS"
          cargo test -p ciphrchat-routing --test live_mailbox -- --ignored --nocapture

      - name: Check relay formatting
        working-directory: omnichat/services/bootstrap-relay
        run: cargo fmt --all --check

      - name: Check relay package
        working-directory: omnichat/services/bootstrap-relay
        run: cargo check --locked

      - name: Test relay package
        working-directory: omnichat/services/bootstrap-relay
        run: cargo test --locked

      - name: Build relay container
        working-directory: omnichat/services/bootstrap-relay
        run: docker build --tag ciphrchat-bootstrap-relay:ci .
